name: popmundo_webview
description: InAppWebView adapter and JS bridge for the Popmundo wrapper.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  popmundo_utils:
    path: ../popmundo_utils
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/js/hooks.js
    - assets/js/helpers.js
